<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>The Still Space | By Arshita</title>
  <script>
    ;(function () {
      if (sessionStorage.getItem('redirect-attempt')) {
        sessionStorage.removeItem('redirect-attempt')
        return
      }

      sessionStorage.setItem('redirect-attempt', '1')
      sessionStorage.setItem('redirect',
        window.location.pathname + window.location.search + window.location.hash)

      window.location.replace('/the-still-space-by-arshita/')
    })()
  </script>
</head>

<body></body>

</html>
